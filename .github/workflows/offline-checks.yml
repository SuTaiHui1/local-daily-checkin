name: Offline source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Syntax, synthetic fixtures, and publication boundary
        shell: powershell
        run: ./scripts/Test-Publish.ps1 -Python python
